[project]
name = "placesdesenergies-data-extraction"
version = "0.1.0"
description = "Energy invoice data extraction using Gemini API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.3.0",
    "openpyxl>=3.1.5",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "requests>=2.31.0",
    "pydantic>=2.12.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PL", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
